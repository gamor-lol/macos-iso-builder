name: Build Full Installer ISO/DMG image

on:
  workflow_dispatch:
    inputs:
      macos_version:
        description: "Choose a macOS version to build."
        required: true
        type: choice
        options:
          - 'Sonoma'
          - 'Ventura'
          - 'Monterey'
          - 'Big Sur'
          - 'Catalina'
          - 'Mojave'
          - 'High Sierra'
      image_format:
        description: "Choose 'iso' for virtual machines, 'dmg' for flash to USB drive."
        required: true
        type: choice
        options:
          - 'iso'
          - 'dmg'

jobs:
  build-macos-image:
    runs-on: macos-latest
    timeout-minutes: 120

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: System Information
        run: |
          echo "Runner OS: $(sw_vers -productName) $(sw_vers -productVersion)"
          echo "Architecture: $(uname -m)"
          echo "RAM: $(top -l 1 | grep PhysMem)"
          echo "CPU: $(sysctl -n machdep.cpu.brand_string)"

      - name: Make mkmaciso executable
        run: chmod +x ./mkmaciso

      - name: Build macOS image
        id: create_image
        run: |
          ./mkmaciso "${{ inputs.macos_version }}" "${{ inputs.image_format }}"
          if [ "${{ inputs.image_format }}" == "iso" ]; then
            echo "image_name=$(basename *.iso)" >> $GITHUB_OUTPUT
          else
            echo "image_name=$(basename *.dmg.img)" >> $GITHUB_OUTPUT
          fi

      - name: Upload artifact
        uses: actions/upload-artifact@v7
        with:
          path: ${{ steps.create_image.outputs.image_name }}
          name: macos-image
          compression-level: 0
          retention-days: 15
          archive: false

      - name: Summary
        if: always()
        run: |
          if [ "${{ steps.create_image.outcome }}" == "failure" ]; then
            echo "## Download macOS failed" >> $GITHUB_STEP_SUMMARY
            echo "> This runner may have network issues. Please re-run the workflow."
          else
            echo "## Successfully built ${{ steps.create_image.outputs.image_name }}" >> $GITHUB_STEP_SUMMARY
            if [ "${{ inputs.image_format }}" == "iso" ]; then
              echo "> This ISO image is intended for virtual machines (Proxmox, QEMU, VMware, VirtualBox)."
            else
              echo "> This DMG image is intended for flashing to USB drives."
            fi
